[project]
name = "bpt-utils"
version = "0.1.0"
description = "Utilidades BPT para pipelines de datos en Databricks"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
# Los notebooks usan variables globales de Databricks (spark, dbutils, display)
extend-exclude = ["sesiones"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
